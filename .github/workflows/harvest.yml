name: harvest
on:
  schedule:
    # 03:00 Novosibirsk (UTC+7) = 20:00 UTC — daily; GitHub cron is always UTC
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["plan.yaml", "students.csv", "scripts/harvest.py", "site/**"]

permissions:
  issues: read
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Harvest submission issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harvest.py
      - name: Deploy state.json to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./site
          keep_files: false
          commit_message: "harvest: ${{ github.sha }}"
